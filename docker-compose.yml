services:
  # ----------------------------------------------------
  # Infrastructure: MySQL 8.0 with Multi-Database Auto-Init
  # ----------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: apex-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Gowravee@3795
      MYSQL_USER: apex_user
      MYSQL_PASSWORD: apex_secret
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pGowravee@3795"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - apex-network

  # ----------------------------------------------------
  # Infrastructure: Apache Kafka (KRaft mode - Zero Zookeeper)
  # ----------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: apex-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    networks:
      - apex-network

  # ----------------------------------------------------
  # Observability: Jaeger (OpenTelemetry Distributed Tracing UI)
  # ----------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: apex-jaeger
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    networks:
      - apex-network

  # ----------------------------------------------------
  # Observability: Prometheus (Metrics Collection)
  # ----------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: apex-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - apex-network

  # ----------------------------------------------------
  # Observability: Grafana (Visualization Dashboards)
  # ----------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.1
    container_name: apex-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - apex-network

  # ----------------------------------------------------
  # Microservice 1: Account Service (Port: 8081)
  # ----------------------------------------------------
  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    container_name: apex-account-service
    ports:
      - "8081:8081"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: apex_user
      MYSQL_PASSWORD: apex_secret
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - apex-network

  # ----------------------------------------------------
  # Microservice 2: Transaction Service (Port: 8082)
  # ----------------------------------------------------
  transaction-service:
    build:
      context: ./transaction-service
      dockerfile: Dockerfile
    container_name: apex-transaction-service
    ports:
      - "8082:8082"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: apex_user
      MYSQL_PASSWORD: apex_secret
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ACCOUNT_SERVICE_URL: http://account-service:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      account-service:
        condition: service_started
    networks:
      - apex-network

  # ----------------------------------------------------
  # Microservice 3: Fraud Detection Service (Port: 8083)
  # ----------------------------------------------------
  fraud-detection-service:
    build:
      context: ./fraud-detection-service
      dockerfile: Dockerfile
    container_name: apex-fraud-service
    ports:
      - "8083:8083"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: apex_user
      MYSQL_PASSWORD: apex_secret
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - apex-network

  # ----------------------------------------------------
  # Microservice 4: Notification Service (Port: 8084)
  # ----------------------------------------------------
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: apex-notification-service
    ports:
      - "8084:8084"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: apex_user
      MYSQL_PASSWORD: apex_secret
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - apex-network

  # ----------------------------------------------------
  # Microservice 5: API Gateway (Port: 8080)
  # ----------------------------------------------------
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: apex-api-gateway
    ports:
      - "8080:8080"
    environment:
      ACCOUNT_SERVICE_URL: http://account-service:8081
      TRANSACTION_SERVICE_URL: http://transaction-service:8082
      FRAUD_SERVICE_URL: http://fraud-detection-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      - account-service
      - transaction-service
      - fraud-detection-service
      - notification-service
    networks:
      - apex-network

networks:
  apex-network:
    driver: bridge

volumes:
  mysql-data:
